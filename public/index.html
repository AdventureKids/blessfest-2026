<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BlessFest — Thanksgiving Day Outreach | CCEA</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#d97757" />
<meta name="description" content="BlessFest is Calvary Chapel East Anaheim's Thanksgiving Day outreach to neighbors experiencing homelessness — a full meal, free services, and a seat at the table. Volunteer or give." />
<meta property="og:title" content="BlessFest — A seat at the table for our neighbors" />
<meta property="og:description" content="CCEA's Thanksgiving Day outreach to neighbors experiencing homelessness. Volunteer or give." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=UnifrakturCook:wght@700&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#161412; --paper:#ffffff; --bg:#faf7f2; --bg2:#f3ede4;
  --orange:#d97757; --orange-deep:#c15f3f; --orange-soft:#f6e1d7;
  --line:#e7e0d6; --muted:#6f6960;
}
html{scroll-behavior:smooth;}
body{font-family:'Archivo',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}

/* ---- type helpers ---- */
.display{font-weight:900;letter-spacing:-.02em;line-height:1.0;text-transform:uppercase;}
.eyebrow{display:inline-block;font-weight:800;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
  background:var(--orange);color:#fff;padding:5px 11px;border-radius:3px;}
.eyebrow.dark{background:var(--ink);}
.eyebrow.ghost{background:transparent;color:var(--orange);padding:0;letter-spacing:.18em;}
.wrap{max-width:1140px;margin:0 auto;padding:0 22px;}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-weight:800;font-size:.92rem;
  text-transform:uppercase;letter-spacing:.04em;padding:13px 22px;border-radius:4px;border:2px solid transparent;
  cursor:pointer;transition:transform .12s,background .15s,color .15s;white-space:nowrap;}
.btn:hover{transform:translateY(-2px);}
.btn--accent{background:var(--orange);color:#fff;}
.btn--accent:hover{background:var(--orange-deep);}
.btn--dark{background:var(--ink);color:#fff;}
.btn--ghost{background:transparent;color:var(--ink);border-color:var(--ink);}
.btn--ghost:hover{background:var(--ink);color:#fff;}
.btn--lg{font-size:1rem;padding:16px 28px;}
.btn--block{display:flex;width:100%;justify-content:center;}

/* ---- header ---- */
header.nav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);}
.nav-in{display:flex;align-items:center;gap:18px;height:88px;position:relative;}
/* slim persistent stats ticker (top of every page except home) */
.ticker{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 12px;background:var(--ink);color:#fff;text-decoration:none;font-size:.76rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:7px 16px;}
.ticker b{font-weight:900;color:#fff;}
.ticker .tk-sep{color:rgba(255,255,255,.38);}
.ticker.hide{display:none;}
@media(max-width:560px){.ticker{font-size:.68rem;gap:3px 8px;letter-spacing:.02em;}}
.brand{display:flex;align-items:center;gap:9px;}
.brand-mark{height:72px;width:auto;display:block;}
.brand-word{height:32px;width:auto;display:block;}
@media(max-width:640px){.nav-in{height:70px;}.brand-mark{height:56px;}.brand-word{height:25px;}}
/* invert the black logo to white on dark backgrounds (footer, team portal) */
.logo-white{filter:brightness(0) invert(1);}
.bf-mark{font-family:'UnifrakturCook',serif;font-weight:700;font-size:1.9rem;line-height:1;color:var(--ink);}
.bf-word{font-weight:900;font-size:1.15rem;letter-spacing:-.01em;background:var(--orange);color:#fff;padding:2px 9px;border-radius:3px;}
.nav-links{margin-left:auto;display:flex;align-items:center;gap:8px;}
.nav-links a.text{font-weight:700;font-size:.86rem;text-transform:uppercase;letter-spacing:.04em;padding:8px 12px;color:var(--ink);}
.nav-links a.text:hover{color:var(--orange);}
.nav-toggle{display:none;background:none;border:none;color:var(--ink);cursor:pointer;padding:6px;margin-left:auto;line-height:0;}

/* ---- hero ---- */
.hero{background:var(--bg);border-bottom:1px solid var(--line);}
.hero-in{display:grid;grid-template-columns:1fr;gap:40px;align-items:start;padding-top:66px;padding-bottom:66px;}
.hero-in--split{grid-template-columns:1.02fr .98fr;align-items:center;gap:48px;}
.hero-video{display:flex;flex-direction:column;gap:10px;}
.hero-video .video-frame{box-shadow:0 16px 42px rgba(20,16,12,.18);}
.hero-video-cap{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:center;}
.hero-video .hero-meta{flex-direction:column;align-items:flex-start;gap:12px;margin-top:6px;padding-top:18px;border-top:1px solid var(--line);}
@media(max-width:900px){.hero-in--split{grid-template-columns:1fr;gap:30px;}.hero-video .hero-meta{align-items:flex-start;}}
.hero h1{font-weight:900;letter-spacing:-.025em;line-height:.98;text-transform:uppercase;
  font-size:clamp(2.6rem,6vw,4.6rem);margin:18px 0 0;}
.hero h1 .red{color:var(--orange);}
.hero .sub{font-size:1.1rem;color:#33302c;margin:22px 0 28px;max-width:48ch;}
.hero .cta-row{display:flex;gap:12px;flex-wrap:wrap;}
.hero-photo{border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3.4;background:var(--bg2);}
.hero-photo img{width:100%;height:100%;object-fit:cover;}
.hero-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;font-weight:700;font-size:.9rem;}
.hero-meta span{display:inline-flex;align-items:center;gap:7px;color:var(--ink);}
.hero-meta svg{color:var(--orange);}

/* ---- sections ---- */
section{padding:64px 0;}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:34px;flex-wrap:wrap;}
.sec-head h2{font-weight:900;text-transform:uppercase;letter-spacing:-.02em;font-size:clamp(1.7rem,3.6vw,2.6rem);line-height:1.02;}
.sec-head .count{font-weight:800;color:var(--muted);font-size:.95rem;}

/* mission */
.mission{background:var(--ink);color:#fff;}
.mission .verse{font-weight:800;font-size:clamp(1.6rem,3.4vw,2.4rem);line-height:1.15;letter-spacing:-.01em;max-width:24ch;}
.mission .verse .ref{display:block;font-size:.8rem;letter-spacing:.16em;color:var(--orange);margin-top:14px;font-weight:800;text-transform:uppercase;}
.mission-grid{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start;}
.mission p{color:#d9d4cc;font-size:1.05rem;}
.mission .closing{margin-top:26px;border-left:3px solid var(--orange);padding-left:18px;color:#fff;font-weight:600;font-style:italic;}
.mission .closing .ref{font-style:normal;color:var(--orange);font-weight:800;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:8px;}

/* highlights */
.hl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.hl{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:22px;}
.hl .n{font-weight:900;color:var(--orange);font-size:1.6rem;line-height:1;}
.hl .l{font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:.95rem;margin:12px 0 6px;}
.hl .d{color:var(--muted);font-size:.9rem;}

/* areas grid */
.areas{background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.area-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.area-card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s;}
.area-card:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(20,16,12,.10);border-color:var(--ink);}
.area-card-body{display:flex;flex-direction:column;gap:12px;padding:22px;flex:1;}
.area-media{aspect-ratio:3/2;overflow:hidden;background:var(--bg2);}
.area-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease;}
.area-card:hover .area-media img{transform:scale(1.045);}
.area-banner{border-radius:14px;overflow:hidden;margin-bottom:22px;aspect-ratio:20/9;max-height:340px;background:var(--bg2);}
.area-banner img{width:100%;height:100%;object-fit:cover;display:block;}
.area-ic{width:46px;height:46px;border-radius:9px;display:grid;place-items:center;background:var(--ink);color:#fff;flex-shrink:0;}
.area-ic svg{width:23px;height:23px;}
.area-card h3{font-weight:900;text-transform:uppercase;font-size:1.12rem;letter-spacing:-.01em;}
.area-card p{color:var(--muted);font-size:.9rem;flex:1;}
.area-more{font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--orange);display:inline-flex;align-items:center;gap:6px;}
.staffed-tag{align-self:flex-start;font-weight:800;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;
  background:var(--bg2);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;}

/* needs */
.needs-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:40px;align-items:start;}
.needs-card h3{font-weight:900;text-transform:uppercase;font-size:1.25rem;margin-bottom:4px;}
.needs-card .note{color:var(--muted);font-size:.9rem;margin-bottom:16px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{font-weight:700;font-size:.88rem;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 14px;}
.cloth-list{display:flex;flex-direction:column;gap:10px;}
.cloth-row{display:flex;gap:12px;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--line);}
.cloth-row .it{font-weight:800;text-transform:uppercase;font-size:.92rem;min-width:130px;}
.cloth-row .nt{color:var(--muted);font-size:.86rem;}

/* CTA band */
.cta-band{background:var(--orange);color:#fff;text-align:center;}
.cta-band h2{font-weight:900;text-transform:uppercase;font-size:clamp(1.8rem,4vw,3rem);letter-spacing:-.02em;line-height:1.02;}
.cta-band p{color:#fbe7dc;font-size:1.05rem;margin:14px auto 26px;max-width:52ch;}
.cta-band .btn--ghost{border-color:#fff;color:#fff;}
.cta-band .btn--ghost:hover{background:#fff;color:var(--orange);}
.cta-band .btn--dark:hover{background:#000;}

/* faq */
.faq details{border-bottom:1px solid var(--line);padding:6px 0;}
.faq summary{list-style:none;cursor:pointer;font-weight:800;font-size:1.05rem;padding:16px 0;display:flex;justify-content:space-between;gap:16px;align-items:center;}
.faq summary::-webkit-details-marker{display:none;}
.faq summary .pm{color:var(--orange);font-weight:900;font-size:1.3rem;transition:transform .2s;}
.faq details[open] summary .pm{transform:rotate(45deg);}
.faq p{padding:0 0 18px;color:#3a3631;max-width:70ch;}

/* footer */
footer.ft{background:var(--ink);color:#cfc9c0;padding:48px 0;}
.ft-in{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:flex-start;}
.ft a{color:#cfc9c0;}.ft a:hover{color:#fff;}
.ft .links{display:flex;gap:26px;flex-wrap:wrap;font-weight:700;text-transform:uppercase;font-size:.82rem;letter-spacing:.04em;}
.ft .addr{font-size:.88rem;line-height:1.7;}
.ft-sub{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  margin-top:34px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);
  font-size:.78rem;color:#9a938a;}
.ft-sub a{color:#9a938a;text-decoration:none;font-weight:700;}
.ft-sub a:hover{color:#fff;}

/* buy-a-shirt floating pop-up */
.shirt-pop{position:fixed;right:18px;bottom:18px;z-index:60;width:214px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 42px rgba(20,16,12,.26);overflow:hidden;transition:transform .35s ease,opacity .35s ease;}
.shirt-pop.hide{transform:translateY(26px);opacity:0;pointer-events:none;}
.shirt-pop.route-hide{display:none;}
.shirt-pop-x{position:absolute;top:7px;right:8px;z-index:3;background:rgba(255,255,255,.8);border:none;width:22px;height:22px;border-radius:50%;font-size:16px;line-height:20px;color:#555;cursor:pointer;padding:0;}
.shirt-pop-x:hover{background:#fff;color:#000;}
.shirt-pop a.sp-link{display:block;text-decoration:none;color:inherit;}
.sp-imgs{position:relative;height:146px;background:linear-gradient(155deg,#2c2622,#161412);display:grid;place-items:center;overflow:hidden;}
.sp-imgs img{position:absolute;height:130px;width:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35));transition:transform .3s ease;}
.sp-imgs .sp-back{transform:translateX(26px) rotate(7deg);}
.sp-imgs .sp-front{transform:translateX(-20px) rotate(-5deg);}
.shirt-pop:hover .sp-back{transform:translateX(34px) rotate(9deg);}
.shirt-pop:hover .sp-front{transform:translateX(-27px) rotate(-6deg);}
.sp-txt{padding:11px 14px 14px;text-align:center;}
.sp-eyebrow{display:block;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-deep);font-weight:800;}
.sp-title{display:block;font-weight:900;text-transform:uppercase;font-size:1.15rem;letter-spacing:-.01em;color:var(--ink);margin-top:3px;line-height:1;}
.sp-cta{display:inline-block;margin-top:7px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--orange);}
.shirt-pop a.sp-link:hover .sp-title{color:var(--orange-deep);}
@media(max-width:640px){.shirt-pop{width:156px;right:10px;bottom:10px;}.sp-imgs{height:108px;}.sp-imgs img{height:94px;}.sp-title{font-size:1rem;}}

/* ---- AREA PAGE ---- */
.area-hero{background:var(--bg);border-bottom:1px solid var(--line);padding:38px 0 46px;}
.back{display:flex;width:fit-content;align-items:center;gap:7px;font-weight:800;text-transform:uppercase;font-size:.78rem;letter-spacing:.06em;color:var(--muted);margin-bottom:24px;}
.back:hover{color:var(--orange);}
.area-title{display:flex;align-items:center;gap:18px;margin:14px 0 16px;}
.area-title .ic{width:60px;height:60px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;flex-shrink:0;}
.area-title .ic svg{width:30px;height:30px;}
.area-title h1{font-weight:900;text-transform:uppercase;font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.02em;line-height:1;}
.area-summary{font-size:1.15rem;color:#33302c;max-width:62ch;}
.area-body{display:grid;grid-template-columns:1.6fr .9fr;gap:40px;align-items:start;padding:54px 0;}
.area-main h3{font-weight:900;text-transform:uppercase;font-size:1.05rem;letter-spacing:.02em;margin:0 0 14px;
  display:inline-flex;align-items:center;gap:10px;}
.area-main h3::before{content:"";width:22px;height:3px;background:var(--orange);border-radius:2px;}
.area-block{margin-bottom:38px;}
.ul{list-style:none;display:flex;flex-direction:column;gap:11px;}
.ul li{display:flex;gap:11px;font-size:1rem;color:#2c2925;}
.ul li::before{content:"";flex-shrink:0;width:8px;height:8px;border-radius:2px;background:var(--orange);margin-top:8px;}
.commit{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.commit-row{display:flex;gap:16px;padding:15px 18px;border-bottom:1px solid var(--line);}
.commit-row:last-child{border-bottom:none;}
.commit-row .d{font-weight:900;text-transform:uppercase;font-size:.85rem;min-width:140px;color:var(--ink);}
.commit-row .t{color:#3a3631;font-size:.95rem;}
.req{background:var(--orange-soft);border:1px solid #eccbb0;border-radius:10px;padding:18px 20px;}
.req .ul li::before{background:var(--orange);}
.req .ul li{font-size:.93rem;}

/* area sidebar */
.area-side{position:sticky;top:104px;display:flex;flex-direction:column;gap:18px;}

/* ---- GIVE PAGE ---- */
.give-body{display:grid;grid-template-columns:1.55fr 1fr;gap:48px;align-items:start;padding:50px 0;}
.give-ways{display:flex;flex-direction:column;}
.give-way{display:flex;gap:18px;padding:24px 0;border-bottom:1px solid var(--line);}
.give-way:first-child{padding-top:4px;}
.give-way:last-child{border-bottom:none;}
.give-way-ic{width:46px;height:46px;flex-shrink:0;border-radius:11px;background:var(--orange-soft);color:var(--orange-deep);display:grid;place-items:center;}
.give-way-ic svg{width:22px;height:22px;}
.give-way h3{font-weight:900;text-transform:uppercase;font-size:1.05rem;letter-spacing:-.01em;margin:2px 0 8px;}
.give-way p{color:#33302c;font-size:1rem;line-height:1.62;margin:0 0 10px;}
.give-way p:last-child{margin-bottom:0;}
.give-sub{font-size:.96rem;line-height:1.55;color:#33302c;margin:9px 0 0;}
.give-sub b{color:var(--ink);}
.give-sub em{color:var(--orange-deep);font-style:normal;font-weight:600;}
.give-sponsor{margin:12px 0 2px;padding:12px 16px;background:var(--orange-soft);border-left:3px solid var(--orange);border-radius:8px;font-size:.96rem;line-height:1.5;color:#5a3a2c;}
.give-sponsor b{color:var(--orange-deep);}
.give-side{position:sticky;top:104px;}
.give-block{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px 22px;box-shadow:0 18px 44px rgba(20,16,12,.10);}
.give-block .gb-head{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.give-block .gb-ic{width:44px;height:44px;flex-shrink:0;border-radius:11px;background:var(--orange-soft);color:var(--orange-deep);display:grid;place-items:center;}
.give-block .gb-ic svg{width:22px;height:22px;}
.give-block h3{font-weight:900;text-transform:uppercase;font-size:1.25rem;letter-spacing:-.01em;margin:0;}
.give-block .gb-sub{color:var(--muted);font-size:.92rem;line-height:1.55;margin:0 0 16px;}
#pushpay-embedded-giving-fallback{min-height:120px;}
.give-fine{font-size:.82rem;color:var(--muted);margin:14px 0 0;text-align:center;}
.give-fine a{color:var(--orange-deep);font-weight:700;}
.side-card{border:1px solid var(--line);border-radius:12px;padding:22px;background:#fff;}
.side-card.dark{background:var(--ink);color:#fff;border-color:var(--ink);}
.side-fact{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem;}
.side-fact:last-child{border-bottom:none;}
.side-fact svg{color:var(--orange);flex-shrink:0;margin-top:2px;}
.side-fact b{display:block;text-transform:uppercase;font-size:.7rem;letter-spacing:.1em;color:var(--muted);font-weight:800;}
.side-card.dark h4{font-weight:900;text-transform:uppercase;font-size:1.1rem;margin-bottom:6px;}
.side-card.dark p{color:#cfc9c0;font-size:.9rem;margin-bottom:16px;}
.side-card.dark .small{font-size:.78rem;color:#9b958c;margin-top:12px;}

.other-areas{background:var(--bg);border-top:1px solid var(--line);padding:54px 0;}
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.mini{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px;cursor:pointer;transition:border-color .14s,transform .14s;}
.mini:hover{border-color:var(--ink);transform:translateY(-2px);}
.mini .ic{width:34px;height:34px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;flex-shrink:0;}
.mini .ic svg{width:18px;height:18px;}
.mini span{font-weight:800;text-transform:uppercase;font-size:.82rem;letter-spacing:-.01em;}

/* live pulse band (countdown + counters) */
.pulse{background:var(--ink);color:#fff;}
.pulse .wrap{padding-top:0;padding-bottom:0;}
.pulse-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;}
.pulse-card{padding:28px 24px;text-align:center;border-right:1px solid rgba(255,255,255,.12);}
.pulse-card:last-child{border-right:none;}
.pulse-lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:#cfc9c0;font-weight:800;margin-top:8px;}
.pulse-num{font-size:2.5rem;font-weight:900;line-height:1;letter-spacing:-.02em;}
.pulse-num small{font-size:1rem;color:#9b958c;font-weight:800;letter-spacing:0;}
.cd-row{display:flex;justify-content:center;gap:24px;}
.cd-row>div{display:flex;flex-direction:column;align-items:center;}
.cd-row span{font-size:2.3rem;font-weight:900;line-height:1;letter-spacing:-.02em;}
.cd-row em{font-style:normal;font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;color:#cfc9c0;font-weight:800;margin-top:5px;}
.bar{height:6px;background:rgba(255,255,255,.16);border-radius:999px;margin:14px auto 0;max-width:220px;overflow:hidden;}
.bar i{display:block;height:100%;width:0;background:var(--orange);transition:width 1.1s ease;}
@media(max-width:760px){.pulse-grid{grid-template-columns:1fr;}.pulse-card{border-right:none;border-bottom:1px solid rgba(255,255,255,.12);}.pulse-card:last-child{border-bottom:none;}}
/* promo video */
.video-sec{background:var(--bg2);}
.video-sec .video-h{font-weight:900;text-transform:uppercase;letter-spacing:-.01em;font-size:clamp(1.4rem,4vw,1.9rem);margin:8px 0 22px;}
.video-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000;box-shadow:0 20px 50px rgba(20,16,12,.14);}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.video-frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;}

/* event team page */
.st-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:10px 0 24px;}
.st-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 22px;text-align:center;}
.st-av{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;position:relative;background:var(--orange-soft);color:var(--orange-deep);display:grid;place-items:center;overflow:hidden;}
.st-avs{display:flex;justify-content:center;gap:10px;margin-bottom:14px;}
.st-avs .st-av{margin:0;}
.st-avs--two .st-av{width:76px;height:76px;}
.st-avs--two .st-av span{font-size:1.25rem;}
.st-av span{font-weight:900;font-size:1.6rem;}
.st-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.st-card h3{margin:0 0 3px;font-size:1.15rem;font-weight:800;}
.st-role{color:var(--orange-deep);font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;}
.st-bio{color:#3a3631;font-size:.92rem;margin:0 0 12px;line-height:1.5;}
.st-contact{display:flex;justify-content:center;gap:10px;margin-top:4px;}
.st-ic{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--bg2);color:var(--orange-deep);border:1px solid var(--line);text-decoration:none;transition:background .14s,border-color .14s;}
.st-ic:hover{background:var(--orange-soft);border-color:var(--orange);}
.st-ic svg{width:18px;height:18px;}
@media(max-width:820px){.st-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:520px){.st-grid{grid-template-columns:1fr;}}

/* area gallery — fanned album */
.area-gallery{padding:42px 0 10px;}
.area-gallery .eyebrow{margin-bottom:8px;}
.fan{position:relative;height:300px;display:flex;justify-content:center;align-items:flex-end;}
.fan .shot{
  position:absolute;bottom:16px;left:50%;width:172px;height:224px;padding:7px;
  background:#fff;border:1px solid var(--line);border-radius:5px;
  box-shadow:0 7px 20px rgba(20,16,12,.16);cursor:pointer;
  transform-origin:bottom center;z-index:calc(var(--i) + 1);
  --mid:calc((var(--n) - 1) / 2);
  transform:translateX(-50%) rotate(calc((var(--i) - var(--mid)) * 7deg));
  transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .2s;
}
.fan .shot img{width:100%;height:100%;object-fit:cover;border-radius:2px;display:block;}
.fan:hover .shot{transform:translateX(-50%) rotate(calc((var(--i) - var(--mid)) * 11deg)) translateY(-4px);}
.fan .shot:hover{transform:translateX(-50%) rotate(0deg) translateY(-16px) scale(1.04);box-shadow:0 18px 42px rgba(20,16,12,.30);z-index:50;}
.fan--one{height:250px;}
.fan--one .shot{width:300px;height:200px;transform:translateX(-50%) rotate(-2.5deg);}
.fan--one:hover .shot{transform:translateX(-50%) rotate(0deg) translateY(-6px);}
@media (max-width:560px){
  .fan{height:250px;}
  .fan .shot{width:138px;height:182px;transform:translateX(-50%) rotate(calc((var(--i) - var(--mid)) * 9deg));}
  .fan--one .shot{width:240px;height:165px;}
}
/* compact fan tucked into the top of the sidebar, above the info card */
.side-gallery{display:flex;justify-content:center;margin-bottom:2px;}
.fan--side{height:198px;width:100%;}
.fan--side .shot{width:114px;height:150px;padding:5px;bottom:6px;}
.fan--side.fan--one{height:172px;}
.fan--side.fan--one .shot{width:210px;height:150px;}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(10,8,6,.93);display:flex;align-items:center;justify-content:center;padding:30px;}
.lightbox[hidden]{display:none;}
#lb-img{max-width:92vw;max-height:82vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.lb-cap{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#f6efe1;font-size:.95rem;padding:0 24px;}
.lb-btn{position:absolute;background:rgba(255,255,255,.13);border:none;color:#fff;cursor:pointer;width:48px;height:48px;border-radius:50%;font-size:1.6rem;line-height:1;display:grid;place-items:center;transition:background .15s;}
.lb-btn:hover{background:var(--orange);}
.lb-close{top:22px;right:22px;font-size:1.15rem;}
.lb-prev{left:22px;top:50%;transform:translateY(-50%);}
.lb-next{right:22px;top:50%;transform:translateY(-50%);}

/* responsive */
@media (max-width:900px){
  .hero-in,.mission-grid,.needs-grid,.area-body,.give-body{grid-template-columns:1fr;gap:30px;}
  .hero-photo{order:-1;aspect-ratio:16/10;}
  .hl-grid{grid-template-columns:1fr 1fr;}
  .area-grid{grid-template-columns:1fr 1fr;}
  .mini-grid{grid-template-columns:1fr 1fr;}
  .area-side,.give-side{position:static;}
  .nav-toggle{display:inline-flex;align-items:center;}
  .nav-links{position:absolute;top:calc(100% + 8px);right:0;margin-left:0;flex-direction:column;align-items:stretch;gap:2px;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;min-width:210px;
    box-shadow:0 16px 44px rgba(20,16,12,.18);display:none;}
  .nav-links.open{display:flex;}
  .nav-links a.text{display:block;padding:11px 14px;border-radius:8px;}
  .nav-links a.text:hover{background:var(--bg2);color:var(--ink);}
  .nav-links .btn{width:100%;justify-content:center;margin-top:4px;}
}
@media (max-width:560px){
  .hl-grid,.area-grid,.mini-grid{grid-template-columns:1fr;}
  section{padding:48px 0;}
  .cloth-row{flex-direction:column;gap:2px;}
  .cloth-row .it{min-width:0;}
  .lb-prev{left:8px;}.lb-next{right:8px;}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto;}.btn:hover,.area-card:hover,.mini:hover{transform:none;}}
/* Volunteer signup popup (embedded Formstack form) */
.vm{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;}
.vm[hidden]{display:none;}
.vm-back{position:absolute;inset:0;background:rgba(20,18,16,.62);backdrop-filter:blur(2px);}
.vm-box{position:relative;background:#fff;border-radius:16px;width:100%;max-width:680px;height:min(90vh,940px);box-shadow:0 24px 70px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column;}
.vm-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 12px 18px;border-bottom:1px solid #e7e0d6;}
.vm-head b{font-size:.95rem;font-weight:800;}
.vm-x{width:34px;height:34px;border-radius:50%;border:none;background:#f3ede4;font-size:1.35rem;line-height:1;cursor:pointer;color:#161412;flex:0 0 auto;}
.vm-x:hover{background:#e7e0d6;}
.vm-frame{flex:1;border:0;width:100%;background:#faf7f2;}
.vm-foot{padding:9px 16px;border-top:1px solid #e7e0d6;font-size:.78rem;color:#6f6960;text-align:center;}
.vm-foot a{color:#c15f3f;}
.vm-intro{padding:12px 18px;border-bottom:1px solid #e7e0d6;background:#faf7f2;}
.vm-intro p{margin:0 0 8px;font-size:.86rem;line-height:1.5;color:#33302c;}
.vm-intro .vm-facts{display:flex;flex-wrap:wrap;gap:5px 16px;font-size:.76rem;color:#6f6960;font-weight:700;}
.vm-intro .vm-facts span{display:inline-flex;align-items:center;gap:5px;}
.vm-intro .vm-facts svg{color:#d97757;flex-shrink:0;}
</style>
</head>
<body>
<header class="nav">
  <a id="ticker" class="ticker hide" href="#/" aria-label="BlessFest countdown and sign-up totals">
    <span><b id="tk-cd">–</b> until BlessFest</span>

    <span><b id="tk-vol">–</b> / 800 volunteers</span>
    <span class="tk-sep">·</span>
    <span><b id="tk-guest">–</b> / 800 Guest RSVPs</span>
  </a>
  <div class="wrap nav-in">
    <a class="brand" href="#/" data-nav="home" aria-label="BlessFest 2026 — home">
      <img class="brand-mark" src="images/logo-mark.png" alt="">
      <img class="brand-word" src="images/logo-wordmark.png" alt="BlessFest">
    </a>
    <nav class="nav-links" id="nav-links">
      <a class="text" href="#/" data-nav="areas">Areas of Service</a>
      <a class="text" href="#/team">Event Team</a>
      <a class="text" id="nav-give" href="#/give">Give</a>
      <a class="btn btn--accent" id="nav-vol" target="_blank" rel="noopener">Volunteer</a>
    </nav>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
</header>

<main id="app"></main>

<!-- Volunteer signup popup — the Formstack form is embedded here (lazy-loaded on open). -->
<div id="vol-modal" class="vm" hidden aria-modal="true" role="dialog" aria-label="Volunteer signup">
  <div class="vm-back" data-close></div>
  <div class="vm-box">
    <div class="vm-head"><b>Volunteer for BlessFest 2026</b><button class="vm-x" type="button" data-close aria-label="Close">&times;</button></div>
    <div class="vm-intro" id="vol-intro"></div>
    <iframe id="vol-frame" class="vm-frame" title="BlessFest volunteer signup form" src="about:blank" loading="lazy"></iframe>
    <div class="vm-foot">Trouble seeing the form? <a id="vol-open" href="#" target="_blank" rel="noopener">Open it in a new tab</a>.</div>
  </div>
</div>

<footer class="ft">
  <div class="wrap ft-in">
    <div>
      <div class="brand" style="margin-bottom:14px;">
        <img class="brand-mark logo-white" src="images/logo-mark.png" alt="">
        <img class="brand-word logo-white" src="images/logo-wordmark.png" alt="BlessFest">
      </div>
      <div class="addr" id="ft-addr"></div>
    </div>
    <div class="links" id="ft-links"></div>
  </div>
  <div class="wrap ft-sub">
    <span>© CCEA · BlessFest 2026</span>
    <a href="/admin/team">Leader &amp; admin sign-in →</a>
  </div>
</footer>

<div class="shirt-pop" id="shirt-pop">
  <button class="shirt-pop-x" id="shirt-pop-x" type="button" aria-label="Dismiss">&times;</button>
  <a class="sp-link" id="shirt-pop-link" target="_blank" rel="noopener">
    <div class="sp-imgs">
      <img class="sp-back" src="images/shirt-white.png" alt="" loading="lazy">
      <img class="sp-front" src="images/shirt-cream.png" alt="BlessFest 2026 shirt" loading="lazy">
    </div>
    <div class="sp-txt">
      <span class="sp-eyebrow">BlessFest 2026</span>
      <span class="sp-title">Buy a Shirt</span>
      <span class="sp-cta">Order yours &rarr;</span>
    </div>
  </a>
</div>

<div id="lightbox" class="lightbox" hidden>
  <button class="lb-btn lb-close" data-lb="close" aria-label="Close">&#10005;</button>
  <button class="lb-btn lb-prev" data-lb="prev" aria-label="Previous">&#8249;</button>
  <img id="lb-img" alt="" />
  <button class="lb-btn lb-next" data-lb="next" aria-label="Next">&#8250;</button>
  <div id="lb-cap" class="lb-cap"></div>
</div>

<script src="data.js"></script>
<script>
const BF = window.BLESSFEST;
const C = BF.config;
let lightboxPhotos = [];
let lbIndex = 0;
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const ICONS = {
  scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/>',

  heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  wave:'<path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
  clipboard:'<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>',
  kids:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  tooth:'<path d="M9 5.5c-1.8-1.2-4-1-5.2.3C2.2 7.4 2.4 10 3.2 12.4c.5 1.6.7 3.3.9 5 .2 1.5.7 3.1 1.9 3.1.9 0 1.2-1.1 1.5-2.6.3-1.4.5-2.9 1.5-2.9s1.2 1.5 1.5 2.9c.3 1.5.6 2.6 1.5 2.6 1.2 0 1.7-1.6 1.9-3.1.2-1.7.4-3.4.9-5 .8-2.4 1-5-.6-6.6C16.9 4.5 14.7 4.3 13 5.5"/>',

  bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>',
  craft:'<path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.6-.7 1.6-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1a1.6 1.6 0 0 1 1.6-1.6h2c3 0 5.5-2.5 5.5-5.6C22 6 17.5 2 12 2Z"/><circle cx="8.5" cy="8.5" r="1"/><circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/>',
  boxes:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>',

  phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
  aid:'<path d="M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h5v5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2Z"/>',
};
const svg = (key, w) => '<svg width="' + (w||24) + '" height="' + (w||24) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[key]||"") + '</svg>';

/* ---------- header + footer wiring ---------- */
document.getElementById("nav-give").href = "#/give";
// Buy-a-shirt pop-up: set its link, and remember a dismissal.
(function () {
  const link = document.getElementById("shirt-pop-link");
  if (link) link.href = C.shirtUrl;
  const pop = document.getElementById("shirt-pop");
  if (!pop) return;
  try { if (localStorage.getItem("bf_shirt_dismissed") === "1") pop.classList.add("hide"); } catch (e) {}
  const x = document.getElementById("shirt-pop-x");
  if (x) x.addEventListener("click", (e) => {
    e.preventDefault(); e.stopPropagation();
    pop.classList.add("hide");
    try { localStorage.setItem("bf_shirt_dismissed", "1"); } catch (_) {}
  });
})();
document.getElementById("nav-vol").href = C.registerUrl;
document.getElementById("ft-addr").innerHTML =
  esc(C.location) + "<br>" + esc(C.address) + "<br>" + esc(C.eventDateShort) + "<br>" +
  '<a href="' + C.homeUrl + '">cc-ea.org</a>';
document.getElementById("ft-links").innerHTML =

/* ---------- Volunteer signup popup ----------
   Every "Volunteer" link points at C.registerUrl. Instead of opening a new tab,
   intercept the click and show the Formstack form in an on-page overlay. Links
   still work with JS off (they keep their href), and the modal offers a
   new-tab fallback in case the form can't be framed. */
(() => {
  if (!C.embedForm) return; // popup off until a real, embeddable 2026 form is set
  const modal = document.getElementById("vol-modal");
  const frame = document.getElementById("vol-frame");
  const openTab = document.getElementById("vol-open");
  openTab.href = C.registerUrl;
  let loaded = false;

  // Give people the basics before the form (they land here straight from a button).
  const intro = document.getElementById("vol-intro");
  if (intro) intro.innerHTML =
    "<p><b>BlessFest</b> is our free Thanksgiving Day outreach &mdash; a warm meal and free services " +
    "for neighbors in need. Pick a shift and an area below; it takes about two minutes.</p>" +
    '<div class="vm-facts">' +
      "<span>" + svg("cal", 15) + esc(C.eventDate) + "</span>" +
      "<span>" + svg("clock", 15) + esc(C.time) + "</span>" +
      "<span>" + svg("pin", 15) + esc(C.location) + "</span>" +
    "</div>";

  function open() {
    if (!loaded) { frame.src = C.registerUrl; loaded = true; }
    modal.hidden = false;
    document.body.style.overflow = "hidden";
  }
  function close() {
    modal.hidden = true;
    document.body.style.overflow = "";
  }

  // Any anchor whose href is the register URL opens the popup — except the
  // in-modal "open in a new tab" fallback, which must keep its normal behavior.
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a");
    if (a && a.getAttribute("href") === C.registerUrl && !a.closest("#vol-modal")) { e.preventDefault(); open(); return; }
    if (e.target.closest("[data-close]")) close();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !modal.hidden) close(); });
})();

    '<h3>' + esc(name) + "</h3>" +

    (bio ? '<p class="st-bio">' + esc(bio) + "</p>" : "") +

// One area-leader card: an avatar per leader (so co-led areas get two photo
// slots), the area as the role, and an email icon per leader.
function areaLeaderCard(item) {
  const people = item.people || [];
  const avatars = people.map((p) => {
    const nm = p.name || item.name;
    return '<div class="st-av"><span>' + esc(stInitials(nm)) + "</span>" +
      (p.photo ? '<img loading="lazy" src="' + esc(p.photo) + '" alt="' + esc(nm) + '" onerror="this.style.display=\'none\'">' : "") + "</div>";
  }).join("");
  const emails = people
    .flatMap((p) => (p.emails && p.emails.length ? p.emails : (p.email ? [p.email] : [])))
    .filter(Boolean)
    .map((e) =>
      '<a class="st-ic" href="mailto:' + esc(e) + '" title="Email ' + esc(item.name) + '" aria-label="Email ' + esc(item.name) + '">' + svg("mail", 18) + "</a>")
    .join("");
  return '<div class="st-card"><div class="st-avs' + (people.length > 1 ? " st-avs--two" : "") + '">' + avatars + "</div>" +
    "<h3>" + esc(item.name) + "</h3><div class=\"st-role\">" + esc(item.area) + "</div>" +
    '<div class="st-contact">' + emails + "</div></div>";

// Area leaders come from /api/area-leaders (backend source of truth, with any
// uploaded photos). Deduped against the event-team staff already shown above.
function loadAreaLeaders() {
  const grid = document.getElementById("area-leaders");
  if (!grid) return;
  const staffEmails = new Set((BF.staff || []).map((s) => (s.email || "").toLowerCase()));
  fetch("/api/area-leaders").then((r) => r.json()).then((list) => {
    const cards = (list || [])
      .filter((item) => (item.people || []).length && !item.people.some((p) => staffEmails.has(p.email)))
      .map(areaLeaderCard)
      .join("");
    if (cards) {
      grid.innerHTML = cards;
      document.getElementById("area-leaders-sec").style.display = "";
    }
  }).catch(() => {});
}

  );
}

// PushPay Embedded Giving. The SPA injects HTML via innerHTML (inline <script>
// won't run), so we set the config and (re)inject the loader when #/give mounts.
function initPushpayGiving() {
  try {
    window.pushpayEmbeddedConfig = { handle: "cceamissions", wgc: "eyJhc2tncCI6dHJ1ZX06S3J6cmN5QmF0N2VnMm9veElaeTVMMktYNGZF" };
    const old = document.getElementById("pushpay-embed-script");
    if (old) old.remove();
    const s = document.createElement("script");
    s.id = "pushpay-embed-script";
    s.type = "text/javascript";
    s.async = true;
    s.src = "https://embedded.pushpay.com?version=1.0.0";
    document.head.appendChild(s);
  } catch (e) { /* fallback link stays */ }
}

function render() {
  const hash = location.hash || "#/";
  const app = document.getElementById("app");
  // Ticker rides along on every page except home (home has the full band).
  const tk = document.getElementById("ticker");
  if (tk) tk.classList.toggle("hide", hash === "#/");
  const sp = document.getElementById("shirt-pop");
  if (sp) sp.classList.toggle("route-hide", hash === "#/give");
  const m = hash.match(/^#\/area\/(.+)$/);
  if (m) {
    const a = BF.areas.find((x) => x.id === m[1]);
    if (a) {
      app.innerHTML = areaHtml(a);
      document.title = a.name + " — BlessFest | CCEA";
      window.scrollTo(0, 0);
      return;
    }
  }
  if (hash === "#/team") {
    app.innerHTML = teamHtml();
    document.title = "Event Team — BlessFest | CCEA";
    window.scrollTo(0, 0);
    applyStaffPhotos();
    loadAreaLeaders();
    return;
  }
  if (hash === "#/give") {
    app.innerHTML = giveHtml();
    document.title = "Give — BlessFest | CCEA";
    window.scrollTo(0, 0);
    initPushpayGiving();
    return;
  }
  app.innerHTML = homeHtml();
  document.title = "BlessFest — Thanksgiving Day Outreach | CCEA";
  initHomeWidgets();
}

/* ---------- home widgets: countdown + live counters ---------- */
let cdTimer = null;
function initHomeWidgets() {
  const target = new Date(C.eventStart || "2026-11-26T06:45:00-08:00").getTime();
  const tick = () => {
    const dEl = document.getElementById("cd-d");
    if (!dEl) { if (cdTimer) { clearInterval(cdTimer); cdTimer = null; } return; }
    let diff = Math.max(0, target - Date.now());
    const days = Math.floor(diff / 86400000); diff -= days * 86400000;
    const hrs = Math.floor(diff / 3600000); diff -= hrs * 3600000;
    const mins = Math.floor(diff / 60000);
    dEl.textContent = days;
    document.getElementById("cd-h").textContent = hrs;
    document.getElementById("cd-m").textContent = mins;
  };
  if (cdTimer) clearInterval(cdTimer);
  tick(); cdTimer = setInterval(tick, 20000);

  fetch("/api/stats").then((r) => r.json()).then((s) => {
    countUp("vol-n", s.volunteers, "vol-bar", C.volunteerGoal || 800);
    countUp("guest-n", s.guests, "guest-bar", C.guestGoal || 800);
  }).catch(() => {});
}
function countUp(numId, value, barId, goal) {
  const el = document.getElementById(numId); if (!el) return;
  const target = Math.max(0, Number(value) || 0);
  let cur = 0; const step = Math.max(1, Math.ceil(target / 40));
  const t = setInterval(() => { cur += step; if (cur >= target) { cur = target; clearInterval(t); } el.textContent = cur.toLocaleString(); }, 25);
  const bar = document.getElementById(barId);
  if (bar && goal) bar.style.width = Math.min(100, Math.round((target / goal) * 100)) + "%";
}

/* The slim persistent ticker — its own live countdown + stats, set up once. */
function initTicker() {
  const target = new Date(C.eventStart || "2026-11-26T06:45:00-08:00").getTime();
  const cd = document.getElementById("tk-cd");
  const tick = () => {
    if (!cd) return;
    let diff = Math.max(0, target - Date.now());
    const d = Math.floor(diff / 86400000); diff -= d * 86400000;
    const h = Math.floor(diff / 3600000); diff -= h * 3600000;
    const mi = Math.floor(diff / 60000);
    cd.textContent = d + "d " + h + "h " + mi + "m";
  };
  tick(); setInterval(tick, 20000);
  fetch("/api/stats").then((r) => r.json()).then((s) => {
    const v = document.getElementById("tk-vol"), g = document.getElementById("tk-guest");
    if (v) v.textContent = (Number(s.volunteers) || 0).toLocaleString();
    if (g) g.textContent = (Number(s.guests) || 0).toLocaleString();
  }).catch(() => {});
}

/* nav helpers: "Areas" scrolls to grid when already home */
document.addEventListener("click", (e) => {
  const link = e.target.closest("[data-nav]");
  if (!link) return;
  const nav = link.dataset.nav;
  if (nav === "areas") {
    e.preventDefault();
    if ((location.hash || "#/") === "#/") {
      document.getElementById("areas")?.scrollIntoView({ behavior: "smooth" });
    } else {
      location.hash = "#/";
      setTimeout(() => document.getElementById("areas")?.scrollIntoView({ behavior: "smooth" }), 60);
    }
  } else if (nav === "home") {
    if ((location.hash || "#/") === "#/") { e.preventDefault(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  }
});

/* mobile menu (hamburger) */
(() => {
  const t = document.getElementById("nav-toggle"), menu = document.getElementById("nav-links");
  if (!t || !menu) return;
  const close = () => { menu.classList.remove("open"); t.setAttribute("aria-expanded", "false"); };
  t.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = menu.classList.toggle("open");
    t.setAttribute("aria-expanded", open ? "true" : "false");
  });
  menu.addEventListener("click", (e) => { if (e.target.closest("a")) close(); });
  document.addEventListener("click", (e) => { if (!menu.contains(e.target) && !t.contains(e.target)) close(); });
  window.addEventListener("hashchange", close);
})();

/* photo lightbox */
function openLightbox(i) {
  lbIndex = i; updateLightbox();
  document.getElementById("lightbox").hidden = false;
  document.body.style.overflow = "hidden";
}
function closeLightbox() {
  document.getElementById("lightbox").hidden = true;
  document.body.style.overflow = "";
}
function stepLightbox(d) {
  if (!lightboxPhotos.length) return;
  lbIndex = (lbIndex + d + lightboxPhotos.length) % lightboxPhotos.length;
  updateLightbox();
}
function updateLightbox() {
  const p = lightboxPhotos[lbIndex]; if (!p) return;
  document.getElementById("lb-img").src = p.src;
  document.getElementById("lb-cap").textContent = "";
  const multi = lightboxPhotos.length > 1;
  document.querySelector(".lb-prev").style.display = multi ? "" : "none";
  document.querySelector(".lb-next").style.display = multi ? "" : "none";
}
document.addEventListener("click", (e) => {
  const shot = e.target.closest(".shot");
  if (shot) { openLightbox(Number(shot.dataset.shot)); return; }
  const lbBtn = e.target.closest("[data-lb]");
  if (lbBtn) {
    const act = lbBtn.dataset.lb;
    if (act === "close") closeLightbox();
    else if (act === "prev") stepLightbox(-1);
    else if (act === "next") stepLightbox(1);
    return;
  }
  if (e.target.id === "lightbox") closeLightbox();
});
document.addEventListener("keydown", (e) => {
  if (document.getElementById("lightbox").hidden) return;
  if (e.key === "Escape") closeLightbox();
  else if (e.key === "ArrowLeft") stepLightbox(-1);
  else if (e.key === "ArrowRight") stepLightbox(1);
});

window.addEventListener("hashchange", render);

/* Apply saved copy edits (from /admin) over the data.js defaults, THEN render.
   The editor writes per-area overrides to KV; /api/content serves them. A short
   fallback guarantees the page renders even if that fetch is slow/unavailable. */
let booted = false;
const boot = () => { if (booted) return; booted = true; render(); initTicker(); };
fetch("/api/content")
  .then((r) => r.json())
  .then((ov) => {
    if (ov && typeof ov === "object") {
      BF.areas.forEach((a) => {
        const o = ov[a.id];
        if (o) Object.keys(o).forEach((k) => { a[k] = o[k]; });
      });
    }
  })
  .catch(() => {})
  .finally(boot);
setTimeout(boot, 1500);
</script>
